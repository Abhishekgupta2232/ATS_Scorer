[theme]
base = "light"
primaryColor = "#2eb4e0"
backgroundColor = "#F5F3FF"
secondaryBackgroundColor = "#EDE9FE"
textColor = "#1E1B4B"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"